<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Baloo+2:wght@600;700&family=Bree+Serif&family=Rubik:wght@500;600;700&family=IM+Fell+English:ital@0;1&family=Cinzel:wght@500;700&family=Libre+Franklin:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: a title screen (world + way to play), then the case desk: folders, an illustrated scene, a dialogue box, notebook and accusation */
:root{
  --paper:#E8ECEF; --panel:#F6F8F9; --ink:#1B2433; --muted:#5B6678; --line:#C6CED7;
  --tag:#B9821F; --tag-ink:#1B2433; --stamp:#B03A2E; --ok:#2F7A4F;
  --shadow:0 1px 0 rgba(27,36,51,.06),0 6px 18px rgba(27,36,51,.07);
  --dlg-bg:#141A23; --dlg-fg:#EEF1F4; --dlg-muted:#9AA6B6; --dlg-accent:#E8B54E;
  --f-display:"Special Elite","Courier New",monospace;
  --f-genre:"Special Elite","Courier New",monospace;
  --f-body:"Libre Franklin",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Courier Prime","Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121821; --panel:#1A222D; --ink:#E2E7ED; --muted:#98A3B3; --line:#2C3644;
  --tag:#E0AE48; --tag-ink:#141A22; --stamp:#E26A5B; --ok:#5DBB86;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --dlg-bg:#0C1118; --dlg-fg:#EEF1F4; --dlg-muted:#8E9AAB; --dlg-accent:#E8B54E; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121821; --panel:#1A222D; --ink:#E2E7ED; --muted:#98A3B3; --line:#2C3644;
  --tag:#E0AE48; --tag-ink:#141A22; --stamp:#E26A5B; --ok:#5DBB86;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --dlg-bg:#0C1118; --dlg-fg:#EEF1F4; --dlg-muted:#8E9AAB; --dlg-accent:#E8B54E; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#home,#game{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
#home>*,#game>*{min-width:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tag);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.label{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}

/* ---------- home ---------- */
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5.4vw,48px);margin:0;line-height:1.02;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.brand .studio{display:inline-flex;align-items:center;gap:7px;margin:0 0 10px;font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.step{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:12px 0 0}
.genres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){.genres{grid-template-columns:1fr}}
.gcard{border:1px solid var(--line);background:var(--panel);border-radius:8px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:grid;box-shadow:var(--shadow);min-width:0}
.gcard svg{display:block;width:100%;height:auto;aspect-ratio:16/9}
.gcard .gb{padding:12px 14px 14px;display:grid;gap:3px}
.gcard .gn{font-size:21px;line-height:1.15}
.gcard .gp{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.gcard .gd{font-size:13.5px;color:var(--muted)}
.gcard .gprog{font-size:12px;font-weight:600;color:var(--ok)}
.gcard.sel{border-color:var(--tag);box-shadow:0 0 0 2px var(--tag),var(--shadow)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.modes{grid-template-columns:1fr}}
.mode{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:12px 14px;text-align:left;cursor:pointer;display:grid;gap:2px;min-width:0}
.mode b{font-size:15px}
.mode span{font-size:13px;color:var(--muted)}
.mode.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mode[disabled]{opacity:.5;cursor:not-allowed}
.launch{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.primary{border:none;background:var(--stamp);color:#fff;font-weight:600;border-radius:4px;padding:11px 18px;cursor:pointer}
.primary:disabled{opacity:.45;cursor:not-allowed}
.secondary{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:10px 14px;cursor:pointer;font-weight:600}
.codein{width:7.5em;text-transform:uppercase;letter-spacing:.2em;font-family:var(--f-mono);font-size:16px;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:9px 10px}
.note{font-size:13px;color:var(--muted);margin:0;max-width:70ch}
.err{color:var(--stamp);font-size:13.5px;margin:0}

/* ---------- game ---------- */
.gamebar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.gamebar .left,.gamebar .right{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.back{background:none;border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.back:hover{color:var(--ink)}
.gtitle{font-family:var(--f-genre);font-size:20px}
.pill{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.codechip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:13px;border:1px dashed var(--tag);border-radius:4px;padding:3px 4px 3px 9px}
.codechip b{letter-spacing:.18em}
.codechip button{border:none;background:var(--tag);color:var(--tag-ink);border-radius:3px;font-size:12px;font-weight:700;padding:3px 8px;cursor:pointer}
.who-list{display:flex;flex-wrap:wrap;gap:6px}
.avatar{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border-radius:999px;padding:2px 9px 2px 3px;border:1px solid var(--line)}
.avatar i{width:18px;height:18px;border-radius:50%;display:inline-block}

.folders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:8px}
.folder{position:relative;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:6px 6px 4px 4px;padding:10px 14px;cursor:pointer;min-width:0;display:grid;gap:1px}
.folder::before{content:"";position:absolute;top:-7px;left:14px;width:56px;height:8px;background:inherit;border:1px solid var(--line);border-bottom:none;border-radius:5px 5px 0 0}
.folder .no{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.08em}
.folder .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder .st{font-size:12px;color:var(--muted)}
.folder.active{border-color:var(--tag);box-shadow:inset 0 -3px 0 var(--tag)}
.folder.locked{cursor:not-allowed;opacity:.55}
.folder.solved .st{color:var(--ok);font-weight:600}
@media (max-width:640px){.folders{grid-template-columns:1fr}}
.brief{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between}
.brief h2{font-family:var(--f-genre);font-weight:400;font-size:clamp(22px,3.4vw,30px);margin:0}
.brief .meta{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}

.stage{border-radius:8px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--dlg-bg)}
.scene svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.hot,.person{cursor:pointer;outline:none}
.hot .hit{fill:transparent;stroke:transparent;stroke-width:3;stroke-dasharray:9 6}
.hot:hover .hit,.hot:focus-visible .hit{fill:rgba(255,214,120,.16);stroke:#F2C45A}
.lbl{opacity:0;transition:opacity .15s;font:600 17px var(--f-body);fill:#fff;paint-order:stroke;stroke:#0B0F15;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.hot:hover .lbl,.hot:focus-visible .lbl,.person:hover .lbl,.person:focus-visible .lbl{opacity:1}
.person:focus-visible .ring,.person:hover .ring{stroke:#F2C45A;stroke-width:3}
.ring{fill:rgba(0,0,0,.28);stroke:transparent}
.person.culprit .ring{stroke:#E26A5B;stroke-width:4;fill:rgba(226,106,91,.25)}
.bubble{opacity:0;transition:opacity .2s}
.person.talking .bubble{opacity:1}
.tagmark,#wren,.peer{pointer-events:none}
.plabel{font:700 14px var(--f-body);fill:#fff;paint-order:stroke;stroke:#0B0F15;stroke-width:4px;stroke-linejoin:round}
.pact{font:500 12px var(--f-body);fill:#F2E3B8;paint-order:stroke;stroke:#0B0F15;stroke-width:3.5px;stroke-linejoin:round}
.beam{transform-box:view-box;transform-origin:830px 97px;animation:sweep 7s ease-in-out infinite alternate}
@keyframes sweep{from{transform:rotate(-14deg)}to{transform:rotate(18deg)}}
.flicker{animation:flick 3s ease-in-out infinite alternate}
@keyframes flick{from{opacity:.82}to{opacity:1}}
.lightning{opacity:0;animation:bolt 6s linear infinite}
@keyframes bolt{0%,88%,100%{opacity:0}89%{opacity:1}90%{opacity:.2}91%{opacity:.9}93%{opacity:0}}
@media (prefers-reduced-motion:reduce){.beam,.flicker{animation:none}.lightning{animation:none;opacity:.6}}

.dialog{background:var(--dlg-bg);color:var(--dlg-fg);padding:14px 18px 16px;display:grid;gap:6px;min-height:118px;border-top:3px solid var(--dlg-accent);cursor:pointer}
.dialog .who{font-family:var(--f-mono);font-size:13px;color:var(--dlg-accent);letter-spacing:.06em;text-transform:uppercase}
.dialog .who span{color:var(--dlg-muted);text-transform:none;letter-spacing:0}
.dialog .line{margin:0;font-size:16px;max-width:75ch;min-height:2.6em}
.dialog .line.quote{font-family:var(--f-genre);font-size:17px}
.dialog .new{justify-self:start;font-size:12.5px;font-weight:700;color:#141A22;background:var(--dlg-accent);border-radius:3px;padding:2px 8px}
.dialog .tip{font-size:12.5px;color:var(--dlg-muted)}

.desk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.desk{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.stats{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.notebook{display:grid;gap:8px}
.clue{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:4px;padding:9px 12px;cursor:pointer}
.clue input{margin-top:3px;accent-color:var(--tag);width:16px;height:16px}
.clue .t{font-weight:600;font-size:14px}
.clue .d{font-size:13.5px;color:var(--muted)}
.clue .kind{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.clue .by{font-size:11.5px;color:var(--tag);font-weight:600}
.clue.checked{border-color:var(--tag);box-shadow:inset 3px 0 0 var(--tag)}
.clue.fresh{animation:fresh 1.2s ease-out}
@keyframes fresh{from{background:color-mix(in srgb,var(--tag) 30%,transparent)}to{background:transparent}}
.empty{color:var(--muted);font-size:14px;margin:0}
.btngrid{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;cursor:pointer;font-size:14px}
.chip:hover{border-color:var(--muted)}
.chip.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.go{border:none;background:var(--stamp);color:#fff;font-weight:600;border-radius:4px;padding:11px 16px;cursor:pointer}
.go:disabled{opacity:.4;cursor:not-allowed}
.req{font-size:13px;color:var(--muted);margin:0}
.verdict{font-size:14px;border-radius:4px;padding:10px 12px;margin:0;border:1px solid var(--stamp)}
.verdict b{color:var(--stamp)}
.hint{background:none;border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:13px;cursor:pointer;color:var(--muted);justify-self:start}
.hint:hover:not(:disabled){color:var(--ink)}
.hint:disabled{opacity:.5;cursor:not-allowed}
.hinttext{font-size:13.5px;margin:0;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.partners{display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
.partner{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13.5px}
.partner i{width:12px;height:12px;border-radius:50%}
.partner .v{color:var(--muted);min-width:0}
.partner .s{font-size:12px;font-weight:700}
.s.ok{color:var(--ok)} .s.no{color:var(--stamp)} .s.wait{color:var(--muted)}
.board{display:grid;gap:4px}
.brow{display:grid;grid-template-columns:2ch minmax(0,1fr) auto;gap:10px;font-size:13.5px;align-items:baseline}
.brow .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.brow.me{font-weight:700}

.solved-card{position:relative;overflow:hidden}
.stamp{position:absolute;right:18px;top:14px;font-family:var(--f-display);color:var(--stamp);border:3px solid var(--stamp);padding:4px 12px;font-size:22px;transform:rotate(-8deg);letter-spacing:.06em;opacity:.9}
@media (prefers-reduced-motion:no-preference){.stamp.anim{animation:thunk .35s cubic-bezier(.2,1.6,.4,1) both}}
@keyframes thunk{from{transform:rotate(-8deg) scale(1.8);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:.9}}
.solved-card h3{font-family:var(--f-genre);font-weight:400;font-size:24px;margin:0;padding-right:120px}
.solved-card p{margin:0;max-width:70ch}
.next{border:none;background:var(--ink);color:var(--paper);border-radius:4px;padding:10px 16px;font-weight:600;cursor:pointer;justify-self:start}
.finale{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin:0}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:6px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);z-index:20}

/* ---------- scene toolbar + mobile ---------- */
.scenebar{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--dlg-bg);color:var(--dlg-muted);padding:8px 12px;font-size:12.5px;border-top:1px solid rgba(255,255,255,.06)}
.lookbtn{white-space:nowrap;flex-shrink:0;border:1px solid rgba(255,255,255,.22);background:transparent;color:var(--dlg-fg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;min-height:36px}
.lookbtn[aria-pressed="true"]{background:var(--dlg-accent);color:#141A22;border-color:var(--dlg-accent)}
.reveal .hot .hit{stroke:#F2C45A;fill:rgba(255,214,120,.10)}
.reveal .lbl{opacity:1}
.scene{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;overscroll-behavior-x:contain}
.mbar{display:none}
@media (max-width:820px){
  .scene svg{width:820px;max-width:none}
  .lbl{font-size:20px}
  .plabel{font-size:17px}
  .pact{font-size:15px}
  .dialog{min-height:132px;padding:12px 14px 14px}
  .dialog .line{font-size:15.5px}
  .dialog .line.quote{font-size:16px}
  .chip{padding:9px 14px}
  .clue{padding:11px 12px}
  #game{padding-bottom:72px}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:15;gap:8px;background:var(--panel);border-top:1px solid var(--line);
    padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));box-shadow:0 -6px 18px rgba(0,0,0,.08)}
  .mbar button{flex:1;min-height:44px;border:1px solid var(--line);background:transparent;border-radius:6px;font-weight:600;font-size:14px;cursor:pointer}
  .mbar button.hl{background:var(--stamp);color:#fff;border-color:var(--stamp)}
  .toast{bottom:calc(82px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:480px){.scene svg{width:760px}.brand h1{font-size:30px}.gtitle{font-size:17px}}

/* ---------- onboarding, profiles ---------- */
#onb{min-height:calc(100vh - 80px);display:grid;place-items:center;padding-block:24px}
.obcard{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:clamp(22px,5vw,36px);display:grid;gap:16px}
.obmark{color:var(--ink)}
.obh{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,5vw,34px);line-height:1.1;margin:0;text-wrap:balance}
.obp{margin:0;color:var(--muted);font-size:15.5px;max-width:52ch}
.field{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.field select,.field input{font-size:16px;font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px;min-height:48px;width:100%}
.frow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
.check{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:14.5px;line-height:1.45;cursor:pointer}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--tag)}
.obact{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding-top:4px}
.primary.big{min-height:48px;padding:0 22px;font-size:16px}
.fine{font-size:12.5px;color:var(--muted);margin:0}
.nicks{display:flex;flex-wrap:wrap;gap:8px}
.nick{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer}
.nick.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.nick.shuffle{background:transparent;color:var(--muted)}
.homebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.homebar .studio{margin:0}
.pchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px 6px 6px;min-height:40px;font-weight:600;cursor:pointer}
.pchip i,.prow i{width:26px;height:26px;border-radius:50%;display:inline-block}
.gtop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.agechip{flex-shrink:0;font-family:var(--f-mono);font-size:11.5px;font-weight:700;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(10,14,22,.45);display:grid;align-items:end;justify-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.sheet{align-items:center}}
.sheetcard{width:100%;max-width:440px;max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border-radius:14px;padding:22px;display:grid;gap:14px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.sh{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0}
.plist{display:grid;gap:6px}
.prow{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 12px;min-height:52px;cursor:pointer}
.prow span{display:grid}
.prow small{color:var(--muted);font-size:12.5px}
.prow.sel{border-color:var(--tag);box-shadow:inset 3px 0 0 var(--tag)}
.shrow{display:flex;flex-wrap:wrap;gap:8px}
.shrow.end{justify-content:flex-end}
.kid{display:grid;gap:10px;border:1px solid var(--line);border-radius:10px;padding:14px}
.kid small{color:var(--muted)}
.link{background:none;border:none;color:var(--stamp);font-weight:600;cursor:pointer;justify-self:start;padding:4px 0}

/* ---------- rank, resume, nightly, help ---------- */
.rankrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:13.5px}
.rkname{font-weight:700}
.rkpts{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.rkbar{flex:1 1 140px;max-width:260px;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.rkbar i{display:block;height:100%;background:var(--tag);border-radius:999px}
.rknext{color:var(--muted);font-size:12.5px}
.rkstreak{font-size:12px;font-weight:700;color:var(--tag-ink);background:var(--tag);border-radius:999px;padding:2px 9px}
.cont{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;border:1px solid var(--tag);background:var(--panel);border-radius:10px;padding:12px 16px}
.cont .ctx{display:grid;gap:2px;min-width:0}
.cont .clbl{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.daily{background:var(--dlg-bg);color:var(--dlg-fg);border-radius:12px;padding:16px 18px;display:grid;gap:10px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.daily::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(232,181,78,.35),rgba(232,181,78,0) 70%);pointer-events:none}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dlbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dlg-accent)}
.dstreak{font-size:12px;font-weight:700;color:#141A22;background:var(--dlg-accent);border-radius:999px;padding:2px 9px}
.dbody{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;position:relative;z-index:1}
.dtx{display:grid;gap:2px;flex:1 1 240px;min-width:0}
.dname{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.15}
.dsub{color:var(--dlg-muted);font-size:13.5px}
.dsub:empty{display:none}
.dchip{font-size:12px;font-weight:700;border:1px solid var(--dlg-accent);color:var(--dlg-accent);border-radius:4px;padding:2px 8px}
.dchip.done{border-color:#5DBB86;color:#5DBB86}
.daily .secondary{background:transparent;color:var(--dlg-fg);border-color:rgba(255,255,255,.25)}
.dnext{margin:0;font-size:12.5px;color:var(--dlg-muted)}
.ptsline{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-size:13px;color:var(--muted)}
.ptsline b{font-size:17px;color:var(--ok)}
.helpfab{position:fixed;z-index:16;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:8px;border:none;background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 16px 8px 8px;min-height:44px;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.helpfab span{width:28px;height:28px;border-radius:50%;background:var(--tag);color:var(--tag-ink);display:grid;place-items:center;font-weight:800;font-size:16px}
@media (max-width:820px){.helpfab.ingame{bottom:calc(76px + env(safe-area-inset-bottom,0px))}.helpfab b{display:none}.helpfab{padding:8px}}
.hsteps{margin:0;padding:0 0 0 22px;display:grid;gap:10px}
.hsteps li{padding-left:4px}
.hsteps li::marker{font-weight:700;color:var(--tag)}
.hsteps b{display:block;font-size:15px}
.hsteps span{color:var(--muted);font-size:14px}
.htip{margin:0;font-size:13.5px;border-left:3px solid var(--tag);padding-left:10px;color:var(--ink)}

/* ---------- modern character + scene polish ---------- */
.spark{pointer-events:none;transform-box:fill-box;transform-origin:50% 50%;animation:spark 1.8s ease-in-out infinite}
@keyframes spark{0%,100%{transform:scale(.7) rotate(0deg);opacity:.55}50%{transform:scale(1.15) rotate(20deg);opacity:1}}
.hot:hover .hit,.hot:focus-visible .hit{fill:rgba(255,214,120,.2)}
.person:hover .ring{fill:rgba(242,196,90,.28)}
@media (prefers-reduced-motion:reduce){.eyes,.spark{animation:none}}

/* ---------- guided accusation + learning ---------- */
.clue.ro{grid-template-columns:minmax(0,1fr);cursor:default}
.step{display:flex;align-items:center;gap:8px;font-size:15px}
.stepn{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:13px;font-weight:700}
.suspects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.suspect{display:grid;justify-items:center;gap:2px;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 6px 10px;cursor:pointer;min-width:0;transition:transform .12s,border-color .12s}
.suspect:hover{transform:translateY(-2px)}
.suspect .pface{width:72px;height:88px;max-width:100%}
.suspect b{font-size:14px}
.suspect small{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.25}
.suspect.sel{border-color:var(--stamp);box-shadow:0 0 0 3px color-mix(in srgb,var(--stamp) 25%,transparent);background:var(--panel)}
.proofs{display:grid;gap:8px;transition:opacity .2s}.proofs.wait{opacity:.55}
.proof{display:grid;grid-template-columns:auto minmax(0,1fr) 28px;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:52px}
.proof .pk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:var(--panel);border:1px solid var(--line)}
.proof .pt{display:grid;gap:2px;min-width:0}
.proof .pt b{font-size:14px}
.proof .pt small{font-size:12.5px;color:var(--muted)}
.proof .pc{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:#fff}
.proof.sel{border-color:var(--tag);background:color-mix(in srgb,var(--tag) 10%,var(--paper))}
.proof.sel .pc{background:var(--tag);border-color:var(--tag)}
.think{border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px}
.think summary{cursor:pointer;font-weight:600}
.think ul{margin:8px 0 2px;padding-left:18px;display:grid;gap:4px;color:var(--muted)}
.skillrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.skillrow i{font-style:normal;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--ok) 14%,transparent);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);border-radius:999px;padding:2px 10px}
.edu{display:grid;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px 16px}
.eduh{display:grid;gap:2px}.eduh b{font-size:16px}.eduh span{font-size:13.5px;color:var(--muted)}
.edug{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.edug{grid-template-columns:repeat(2,minmax(0,1fr))}}
.edut{display:grid;gap:2px;align-content:start;min-width:0}
.edui{font-size:20px}
.edut b{font-size:13.5px}.edut small{font-size:12.5px;color:var(--muted);line-height:1.35}

/* ---------- character rig: modern motion ---------- */
.rig,.torso,.head,.arm,.leg,.emote,.eyes,.pupils{transform-box:view-box}
.rig{transform-origin:0 0}
.torso{transform-origin:0 -52px;animation:breathe 2.8s ease-in-out var(--d,0s) infinite}
.head{transform-origin:0 -112px;animation:look 5.2s ease-in-out var(--d,0s) infinite}
.arm.l{transform-origin:-17px -104px;animation:swayL 2.8s ease-in-out var(--d,0s) infinite}
.arm.r{transform-origin:17px -104px;animation:swayR 2.8s ease-in-out var(--d,0s) infinite}
.leg.l{transform-origin:-7px -52px}.leg.r{transform-origin:7px -52px}
.eyes{transform-origin:0 -129px;animation:blink 4.6s var(--d,0s) infinite}
.pupils{animation:glance 7s ease-in-out var(--d,0s) infinite}
.m-smile,.m-open,.m-o,.sweat,.brows{transition:opacity .15s}
.brows{transform-box:view-box;transform-origin:0 -135px}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-1px) scale(1.012,1.028)}}
@keyframes look{0%,100%{transform:rotate(-2deg)}45%{transform:rotate(2.5deg)}70%{transform:rotate(0deg) translateY(-1px)}}
@keyframes swayL{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-3deg)}}
@keyframes swayR{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.1)}}
@keyframes glance{0%,40%,100%{transform:translateX(0)}48%,62%{transform:translateX(1.4px)}70%,82%{transform:translateX(-1.2px)}}
/* walk: bounce + squash, legs and arms counter-swing */
.walking .rig{animation:stride .34s ease-in-out infinite alternate}
.walking .leg.l{animation:legA .34s ease-in-out infinite alternate}
.walking .leg.r{animation:legB .34s ease-in-out infinite alternate}
.walking .arm.l{animation:legB .34s ease-in-out infinite alternate}
.walking .arm.r{animation:legA .34s ease-in-out infinite alternate}
.walking .head{animation:nod .34s ease-in-out infinite alternate}
.walking .torso{animation:none;transform:rotate(3deg)}
@keyframes stride{from{transform:translateY(0) scale(1.03,.96)}to{transform:translateY(-7px) scale(.98,1.03)}}
@keyframes legA{from{transform:rotate(26deg)}to{transform:rotate(-26deg)}}
@keyframes legB{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
@keyframes nod{from{transform:rotate(-2deg) translateY(1px)}to{transform:rotate(2deg) translateY(-1px)}}
/* talking: head bobs, mouth moves, one hand gestures */
.talking .head{animation:chat .42s ease-in-out infinite alternate}
.talking .arm.r{animation:gesture 1.1s ease-in-out infinite alternate}
.talking .m-open{animation:mouth .26s steps(1) infinite}
.talking .m-smile{animation:mouthB .26s steps(1) infinite}
@keyframes chat{from{transform:rotate(-4deg)}to{transform:rotate(3deg) translateY(-1.5px)}}
@keyframes gesture{0%{transform:rotate(-8deg)}40%{transform:rotate(-58deg)}100%{transform:rotate(-38deg)}}
@keyframes mouth{0%{opacity:1}50%{opacity:0}}
@keyframes mouthB{0%{opacity:0}50%{opacity:1}}
/* hop: anticipation, jump, land (clue found / tapped) */
.hop .rig{animation:hop .6s cubic-bezier(.3,.7,.4,1)}
.hop .emote{animation:emote 1.1s ease-out}
.hop .m-o{opacity:1}.hop .m-smile{opacity:0}
@keyframes hop{0%{transform:scale(1,1)}15%{transform:scale(1.14,.84)}45%{transform:translateY(-30px) scale(.9,1.12)}72%{transform:translateY(0) scale(1.12,.88)}86%{transform:scale(.97,1.04)}100%{transform:scale(1,1)}}
@keyframes emote{0%{opacity:0;transform:translateY(10px) scale(.3)}25%{opacity:1;transform:translateY(-6px) scale(1.15)}40%,80%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-6px) scale(.9)}}
.emote{transform-origin:0 -200px}
/* cheer: case solved */
.cheer .rig{animation:cheer .55s cubic-bezier(.3,.7,.4,1) 4}
.cheer .arm.l{animation:none;transform:rotate(150deg);transition:transform .2s}
.cheer .arm.r{animation:none;transform:rotate(-150deg);transition:transform .2s}
.cheer .m-open{opacity:1}.cheer .m-smile{opacity:0}
@keyframes cheer{0%,100%{transform:scale(1,1)}20%{transform:scale(1.1,.88)}50%{transform:translateY(-26px) scale(.94,1.08)}80%{transform:scale(1.08,.92)}}
/* busted: the culprit is caught */
.busted .rig{animation:shake .09s linear 8,lean .4s ease-out .72s forwards}
.busted .sweat{opacity:1;animation:drip 1.2s ease-in infinite}
.busted .m-o{opacity:1}.busted .m-smile{opacity:0}
.busted .brows{transform:translateY(-1.6px)}
.busted .arm.l{animation:none;transform:rotate(-24deg)}.busted .arm.r{animation:none;transform:rotate(24deg)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes lean{to{transform:rotate(-5deg) scale(1,.97)}}
@keyframes drip{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(8px);opacity:0}}
/* shrug: wrong accusation, the detective shakes their head */
.shrug .head{animation:no .5s ease-in-out 2}
@keyframes no{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.torso,.head,.arm,.leg,.rig,.eyes,.pupils,.emote,.sweat{animation:none!important}}
.musicbtn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;font:600 13px/1 inherit;padding:7px 12px;min-height:34px;cursor:pointer;white-space:nowrap}
@media (max-width:520px){.musicbtn .ml{display:none}.musicbtn{padding:7px 10px}}
.musicbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
</style>
